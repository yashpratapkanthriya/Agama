</div>

</a>

<span class="material-symbols-outlined">insights</span>
<span class="font-label-caps text-label-caps mt-1">Stats</span>
</a>

<script>
        const words = "In the heart of the digital age, the concept of intelligence has undergone a profound transformation. We are no longer mere observers of information but active architects of our own cognitive environments. The speed at which we process data determines our ability to synthesize knowledge and create meaning. Scholarly is designed to facilitate this flow state, where words become thoughts and thoughts become insights without the friction of traditional reading barriers.".split(" ");
        
        let currentIndex = 0;
        let isPlaying = false;
        let timer = null;
        let wpm = 450;

        const wordDisplay = document.getElementById('current-word');
        const playBtn = document.getElementById('btn-play-pause');
        const playIcon = document.getElementById('play-icon');
        const progressBar = document.getElementById('reading-progress');
        const wpmSlider = document.getElementById('wpm-slider');
        const wpmValue = document.getElementById('wpm-value');
        const rewindBtn = document.getElementById('btn-rewind');
        const ffBtn = document.getElementById('btn-ff');

        function updateWord() {
            if (currentIndex >= words.length) {
                pause();
                currentIndex = 0;
                return;
            }
            wordDisplay.textContent = words[currentIndex];
            const progress = ((currentIndex + 1) / words.length) * 100;
            progressBar.style.width = `${progress}%`;
            currentIndex++;
        }

        function play() {
            isPlaying = true;
            playIcon.textContent = 'pause';
            const interval = (60 / wpm) * 1000;
            timer = setInterval(updateWord, interval);
        }

        function pause() {
            isPlaying = false;
            playIcon.textContent = 'play_arrow';
            clearInterval(timer);
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) pause();
            else play();
        });

        wpmSlider.addEventListener('input', (e) => {
            wpm = e.target.value;
            wpmValue.textContent = wpm;
            if (isPlaying) {
                pause();
                play();
            }
        });

        rewindBtn.addEventListener('click', () => {
            currentIndex = Math.max(0, currentIndex - 10);
            updateWord();
        });

        ffBtn.addEventListener('click', () => {
            currentIndex = Math.min(words.length - 1, currentIndex + 10);
            updateWord();
        });

        // Initialize first word
        wordDisplay.textContent = words[0];
    </script>
